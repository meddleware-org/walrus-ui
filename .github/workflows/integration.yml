name: Integration (e2e)

# Opt-in browser e2e for the SPA. Kept off the PR path. Today this runs the Playwright smoke suite
# (builds + serves the app, drives the shell in a real browser) — it needs no localnet.
#
# The full localnet upload e2e (e2e/upload.localnet.spec.ts) is marked `fixme` pending two follow-ups
# (a browser-injectable signing wallet + a localnet build target — see that spec). Once they land,
# un-fixme it and enable the "localnet testbed" block below so the upload path runs against the
# Docker-Compose testbed from the walrus-client repo.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # nightly

jobs:
  e2e:
    name: walrus-ui browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install deps
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── localnet testbed (enable once upload.localnet.spec.ts is un-fixme'd) ──────────────────
      # - name: Checkout walrus-client + access-gate-sui, bring up testbed
      #   run: |
      #     git clone --depth 1 https://github.com/meddleware-org/walrus-client ../walrus-client
      #     git clone --depth 1 https://github.com/meddleware-org/access-gate-sui ../access-gate-sui
      #     ( cd ../walrus-client/localnet && bash scripts/up.sh && bash scripts/bootstrap-localnet.sh )
      #     set -a && source ../walrus-client/localnet/.env.localnet && set +a

      - name: Run e2e (smoke; localnet upload self-skips until enabled)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
